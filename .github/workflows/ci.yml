name: CI

on:
  push:
    branches: ["main", "latest", "beta-*"]
  pull_request:
    branches: ["main", "latest", "beta-*"]
  # Started by node-switchbot-update.yml: pull requests it opens with GITHUB_TOKEN don't trigger CI
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test

      - name: Lint
        run: npm run lint
