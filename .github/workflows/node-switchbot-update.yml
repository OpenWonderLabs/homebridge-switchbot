name: Update node-switchbot

# When node-switchbot publishes a new release (patch, minor or major), open a pull request to
# latest that updates it. Merging the pull request publishes a plugin release through release.yml.
#
# The pull request changes only the node-switchbot dependency range in package.json and its
# entries in package-lock.json. It never changes the plugin's own "version": the release workflow
# sets that when it publishes, from the patch / minor / major label on the merged pull request.
#
# The label is set to match the node-switchbot change. Change it before merging if the plugin
# release should be a different kind (for example a node-switchbot major that needs no plugin
# changes can ship as a minor).

on:
  schedule:
    - cron: '23 * * * *' # hourly
  workflow_dispatch:
  # Lets node-switchbot's release workflow trigger this immediately, if it is given a token that
  # can dispatch to this repository:
  #   gh api repos/OpenWonderLabs/homebridge-switchbot/dispatches -f event_type=node-switchbot-released
  repository_dispatch:
    types: [node-switchbot-released]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: node-switchbot-update
  cancel-in-progress: false

env:
  BRANCH: deps/node-switchbot

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: latest

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Compare with the newest node-switchbot on npm
        id: check
        run: |
          published=$(npm view node-switchbot@latest version)
          wanted=$(node -p "require('./package.json').dependencies['node-switchbot']")
          current=$(node -p "process.argv[1].replace(/^[^0-9]*/, '')" "$wanted")
          level=$(node -e '
            const [a, b] = process.argv.slice(1).map(v => v.split("-")[0].split(".").map(Number))
            const newer = a[0] !== b[0] ? a[0] > b[0] : a[1] !== b[1] ? a[1] > b[1] : a[2] > b[2]
            console.log(!newer ? "none" : a[0] !== b[0] ? "major" : a[1] !== b[1] ? "minor" : "patch")
          ' "$published" "$current")
          {
            echo "published=$published"
            echo "current=$current"
            echo "level=$level"
          } >> "$GITHUB_OUTPUT"
          echo "node-switchbot: plugin requires ^$current, npm latest is $published -> $level"

      - name: Close an update pull request that latest has caught up with
        if: steps.check.outputs.level == 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh pr list --head "$BRANCH" --base latest --state open --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh pr close "$number" --delete-branch \
              --comment "latest already requires node-switchbot ^${{ steps.check.outputs.current }}, the newest release."
          fi

      - name: Find an open update pull request
        if: steps.check.outputs.level != 'none'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh pr list --head "$BRANCH" --base latest --state open --json number --jq '.[0].number // empty')
          title=$(gh pr list --head "$BRANCH" --base latest --state open --json title --jq '.[0].title // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"
          # Skip when the open pull request already proposes this version
          if [[ -n "$number" && "$title" == *" ${{ steps.check.outputs.published }}" ]]; then
            echo "uptodate=true" >> "$GITHUB_OUTPUT"
            echo "Pull request #$number already updates to ${{ steps.check.outputs.published }}"
          fi

      - name: Update node-switchbot
        if: steps.check.outputs.level != 'none' && steps.pr.outputs.uptodate != 'true'
        run: |
          git switch -C "$BRANCH"
          npm pkg set "dependencies.node-switchbot=^${{ steps.check.outputs.published }}"
          npx -y npm@11 install --package-lock-only --ignore-scripts
          # Only the dependency may change: never the plugin's own version
          before=$(git show HEAD:package.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          after=$(node -p "require('./package.json').version")
          test "$before" = "$after"
          git diff --stat

      - name: Build, test and lint
        if: steps.check.outputs.level != 'none' && steps.pr.outputs.uptodate != 'true'
        id: verify
        continue-on-error: true
        run: |
          npm ci --legacy-peer-deps
          npm run build
          npm test
          npm run lint

      - name: Push the update branch
        if: steps.check.outputs.level != 'none' && steps.pr.outputs.uptodate != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Commit only the dependency change; the build regenerates other files
          git add package.json package-lock.json
          git commit -m "fix(deps): update node-switchbot to ${{ steps.check.outputs.published }}"
          # The branch belongs to this workflow; replace it with an update from current latest
          git push --force origin "$BRANCH"

      - name: Open or update the pull request
        if: steps.check.outputs.level != 'none' && steps.pr.outputs.uptodate != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ steps.check.outputs.published }}
          CURRENT: ${{ steps.check.outputs.current }}
          LEVEL: ${{ steps.check.outputs.level }}
          VERIFY: ${{ steps.verify.outcome }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          title="fix(deps): update node-switchbot to $PUBLISHED"
          if [[ "$VERIFY" == "success" ]]; then
            checks="Build, test and lint passed in the update workflow."
          else
            checks="**Build, test or lint failed** in the [update workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). The plugin needs changes before this can be merged."
          fi
          major_note=""
          if [[ "$LEVEL" == "major" ]]; then
            major_note=$'\n\n'"**This is a new major version of node-switchbot.** Read its release notes for breaking changes, and test it (or add plugin changes to this branch) before merging."
          fi
          body=$(cat <<EOF
          Updates \`node-switchbot\` from \`^$CURRENT\` to \`^$PUBLISHED\` (a **$LEVEL** update).

          - [node-switchbot v$PUBLISHED release notes](https://github.com/OpenWonderLabs/node-switchbot/releases/tag/v$PUBLISHED)
          - Changes only the \`node-switchbot\` range in \`package.json\` and its entries in \`package-lock.json\`. The plugin's own \`version\` is set by the release workflow when this is merged.
          - Labelled \`$LEVEL\`: merging publishes a $LEVEL plugin release. Change the label before merging for a different kind of release.

          $checks$major_note

          _Opened by the "Update node-switchbot" workflow. If a newer node-switchbot is published before this is merged, this pull request is updated to it._
          EOF
          )
          # Create the labels only if missing; never change existing ones
          for label in "$LEVEL" dependencies; do
            gh label create "$label" >/dev/null 2>&1 || true
          done
          if [[ -n "$NUMBER" ]]; then
            gh pr edit "$NUMBER" --title "$title" --body "$body"
            for old in patch minor major; do
              [[ "$old" == "$LEVEL" ]] || gh pr edit "$NUMBER" --remove-label "$old" >/dev/null 2>&1 || true
            done
            gh pr edit "$NUMBER" --add-label "$LEVEL" --add-label dependencies
            echo "Updated pull request #$NUMBER" >> "$GITHUB_STEP_SUMMARY"
          else
            url=$(gh pr create --base latest --head "$BRANCH" --title "$title" --body "$body" \
              --label "$LEVEL" --label dependencies)
            echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run CI on the pull request
        if: steps.check.outputs.level != 'none' && steps.pr.outputs.uptodate != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Pull requests opened with GITHUB_TOKEN do not start CI on their own; workflow_dispatch does,
        # and its checks show on the pull request's commit.
        run: gh workflow run ci.yml --ref "$BRANCH"
